<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ResolvIA</title>
    <meta name="description" content="IT service desk with configurable SLAs, self-service guides and an AI that triages, suggests fixes and resolves what it can by itself." />
    <meta name="theme-color" content="#f7f7f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/styles.css" />
    <script>
      // Apply the saved theme before the first paint (no light/dark flash).
      try {
        const prefs = JSON.parse(localStorage.getItem("resolvia.prefs.v1") || "{}");
        if (prefs.theme === "light" || prefs.theme === "dark") document.documentElement.dataset.theme = prefs.theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div class="toasts" id="toasts" aria-live="polite"></div>
    <input type="file" id="import-input" accept="application/json,.json" hidden />
    <noscript>ResolvIA needs JavaScript.</noscript>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
